name: Python Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          # Simulate deployment environment variables for testing
          PROJECT_ID: test-project
          REGION: us-central1
          VERTEX_LOCATION: global
          MODEL_ID: gemini-3.6-flash
          AIMS_CLASSIFIER_MODEL_ID: gemini-3.6-flash
          TEMPERATURE: "0.2"
          MAX_TOKENS: "768"
          AIMS_COACHING_ENABLED: "true"
          AIMS_COACHING_DEFAULT: "true"
          MEMORY_BACKEND: memory
          CHAINLIT_AUTH_SECRET: test-chainlit-secret-for-ci
          OAUTH_GOOGLE_CLIENT_ID: test-client-id-for-ci
          OAUTH_GOOGLE_CLIENT_SECRET: test-client-secret-for-ci
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          pytest --ignore=tests/integration
