name: Python Tests

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]
    tags: [ "v*", "release-*" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

       - name: Run tests
         env:
           # Simulate deployment environment variables for testing
           PROJECT_ID: test-project
           REGION: us-central1
           MODEL_ID: gemini-2.5-pro
           TEMPERATURE: "0.2"
           MAX_TOKENS: "768"
           AIMS_COACHING_ENABLED: "true"
           AIMS_COACHING_DEFAULT: "true"
           MEMORY_BACKEND: memory
           CHAINLIT_AUTH_SECRET: test-chainlit-secret-for-ci
           OAUTH_GOOGLE_CLIENT_ID: test-client-id-for-ci
           OAUTH_GOOGLE_CLIENT_SECRET: test-client-secret-for-ci
         run: |
           export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
           pytest
