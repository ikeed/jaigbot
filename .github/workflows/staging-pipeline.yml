name: Staging Promotion Pipeline

on:
  push:
    branches: [ "staging" ]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  deploy:
    needs: quality
    uses: ./.github/workflows/deploy.yaml
    with:
      target_env: staging
    secrets: inherit
