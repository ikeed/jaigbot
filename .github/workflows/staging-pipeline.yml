name: Staging Promotion Pipeline

on:
  push:
    branches: [ "staging" ]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  # Runs in parallel with deploy (not a gate) -- real multi-turn Vertex AI
  # conversations are slow and can be non-deterministic, so a flaky live-LLM
  # run must never block or delay a deploy. See live-tests.yml.
  live-tests:
    needs: quality
    uses: ./.github/workflows/live-tests.yml
    secrets: inherit

  deploy:
    needs: quality
    uses: ./.github/workflows/deploy.yaml
    with:
      target_env: staging
    secrets: inherit
