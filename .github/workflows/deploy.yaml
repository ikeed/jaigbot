name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_REPO: ${{ vars.GAR_REPO }}
  APP_ENV: ${{ inputs.target_env || github.event.inputs.target_env }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  STAGING_SERVICE_NAME: ${{ vars.STAGING_SERVICE_NAME }}
  MODEL_ID: ${{ vars.MODEL_ID }}
  AIMS_CLASSIFIER_MODEL_ID: ${{ vars.AIMS_CLASSIFIER_MODEL_ID }}
  AIMS_CLASSIFIER_THINKING_LEVEL: ${{ vars.AIMS_CLASSIFIER_THINKING_LEVEL }}
  VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
  TEMPERATURE: ${{ vars.TEMPERATURE }}
  MAX_TOKENS: ${{ vars.MAX_TOKENS }}
  HOST: 0.0.0.0
  # SSO Credentials
  CHAINLIT_AUTH_SECRET: ${{ secrets.CHAINLIT_AUTH_SECRET }}
  CHAINLIT_URL: ${{ vars.CHAINLIT_URL }}
  STAGING_CHAINLIT_URL: ${{ vars.STAGING_CHAINLIT_URL }}
  OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
  OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
  # Optional runtime tuning and memory settings
  MEMORY_BACKEND: ${{ vars.MEMORY_BACKEND }}
  MEMORY_TTL_SECONDS: ${{ vars.MEMORY_TTL_SECONDS }}
  REDIS_URL: ${{ vars.REDIS_URL }}
  REDIS_HOST: ${{ vars.REDIS_HOST }}
  REDIS_PORT: ${{ vars.REDIS_PORT }}
  VPC_CONNECTOR: ${{ vars.VPC_CONNECTOR }}
  # Optional: for Terraform backend initialization (trimmed in script)
  TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
  TF_BACKEND_PREFIX: ${{ vars.TF_BACKEND_PREFIX }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.target_env || github.event.inputs.target_env }}-${{ github.sha }}
      cancel-in-progress: false
    env:
      WORKLOAD_IDP: ${{ secrets.WORKLOAD_IDP }}
      WORKLOAD_SA: ${{ secrets.WORKLOAD_SA }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select deployment environment
        run: |
          if [[ "$APP_ENV" == "staging" ]]; then
            echo "SERVICE_NAME=${STAGING_SERVICE_NAME:-aimsbot-staging}" >> "$GITHUB_ENV"
            echo "CHAINLIT_URL=${STAGING_CHAINLIT_URL}" >> "$GITHUB_ENV"
          else
            echo "SERVICE_NAME=${SERVICE_NAME}" >> "$GITHUB_ENV"
            echo "CHAINLIT_URL=${CHAINLIT_URL}" >> "$GITHUB_ENV"
          fi

      - name: Validate required variables
        run: |
          MISSING=()
          [[ -z "$PROJECT_ID" ]] && MISSING+=(PROJECT_ID)
          [[ -z "$REGION" ]] && MISSING+=(REGION)
          [[ -z "$GAR_REPO" ]] && MISSING+=(GAR_REPO)
          [[ -z "$SERVICE_NAME" ]] && MISSING+=(SERVICE_NAME)
          if [[ "$APP_ENV" == "prod" && -z "$CHAINLIT_URL" ]]; then
            MISSING+=(CHAINLIT_URL)
          fi
          if (( ${#MISSING[@]} )); then
            echo "Error: Missing required repository variables: ${MISSING[*]}" >&2
            echo "Set these in Settings → Secrets and variables → Actions → Variables." >&2
            exit 1
          fi
          if [[ "$APP_ENV" == "staging" && -z "$CHAINLIT_URL" ]]; then
            echo "Warning: STAGING_CHAINLIT_URL is not set. The staging service will deploy for URL discovery, but OAuth may not work until you set it and redeploy." >&2
          fi
      - name: Validate auth configuration
        env:
          WORKLOAD_IDP: ${{ secrets.WORKLOAD_IDP }}
          WORKLOAD_SA: ${{ secrets.WORKLOAD_SA }}
          CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [[ -n "$CREDENTIALS_JSON" ]]; then
            echo "Using credentials_json authentication via GCP_SA_KEY"
            exit 0
          fi
          if [[ -n "$WORKLOAD_IDP" && -n "$WORKLOAD_SA" ]]; then
            echo "Using Workload Identity Federation authentication"
            exit 0
          fi
          echo "Error: Missing auth configuration. Set WORKLOAD_IDP and WORKLOAD_SA secrets for WIF, or GCP_SA_KEY for JSON key auth." >&2
          exit 1

      - name: Echo GitHub context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event_name=${{ github.event_name }}"
          echo "workflow_ref=${{ github.workflow_ref }}"
          echo "actor=${{ github.actor }}"

      - name: Authenticate to Google Cloud (WIF)
        if: env.WORKLOAD_IDP != '' && env.WORKLOAD_SA != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDP }}
          service_account: ${{ secrets.WORKLOAD_SA }}

      - name: Authenticate to Google Cloud (Service Account JSON)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify gcloud authentication
        run: |
          gcloud auth list --filter='status:ACTIVE' --format='value(account)' | grep -q . || exit 1
          gcloud config set project "$PROJECT_ID"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev -q

      - name: Build and push container image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE_NAME:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE_NAME:${GITHUB_SHA}"
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "cr-vertex-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars "APP_ENV=${APP_ENV},PROJECT_ID=${PROJECT_ID},REGION=${REGION},VERTEX_LOCATION=${VERTEX_LOCATION:-global},MODEL_ID=${MODEL_ID:-gemini-3.6-flash},AIMS_CLASSIFIER_MODEL_ID=${AIMS_CLASSIFIER_MODEL_ID:-gemini-3.6-flash},AIMS_CLASSIFIER_THINKING_LEVEL=${AIMS_CLASSIFIER_THINKING_LEVEL:-},TEMPERATURE=${TEMPERATURE:-0.2},MAX_TOKENS=${MAX_TOKENS:-768},HOST=${HOST:-0.0.0.0},AIMS_COACHING_ENABLED=true,AIMS_COACHING_DEFAULT=true,MEMORY_BACKEND=${MEMORY_BACKEND:-memory},MEMORY_TTL_SECONDS=${MEMORY_TTL_SECONDS:-1296000},REDIS_URL=${REDIS_URL:-},REDIS_HOST=${REDIS_HOST:-},REDIS_PORT=${REDIS_PORT:-6379},CHAINLIT_URL=${CHAINLIT_URL:-},CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET:-},OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-},OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-},VALIDATE_MODEL_ON_STARTUP=false,SESSIONS_BUCKET_NAME=${{ vars.SESSIONS_BUCKET_NAME || 'aimsbot-chat-sessions' }},REPORTS_BUCKET_NAME=${{ vars.REPORTS_BUCKET_NAME || 'aimsbot-bug-reports' }}" \
            ${VPC_CONNECTOR:+--vpc-connector="$VPC_CONNECTOR" --vpc-egress=private-ranges-only} \
            --memory=512Mi --cpu=1 --concurrency=20 --max-instances=2 --min-instances=1 --timeout=3600 \
            --cpu-throttling \
            --startup-probe="httpGet.path=/api/healthz,periodSeconds=10,timeoutSeconds=9,failureThreshold=12"

      - name: Route traffic to latest revision
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region "$REGION" \
            --to-latest

      - name: Show service URL and health check
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format 'value(status.url)')
          echo "Service URL: $URL"
          curl -fsS "$URL/api/healthz" || true

          if [[ "$APP_ENV" == "staging" ]]; then
            PUBLIC_URL="https://staging.aimsbot.ca"
          else
            PUBLIC_URL="https://aimsbot.ca"
          fi
          echo "Public URL: $PUBLIC_URL"
          curl -fsS "$PUBLIC_URL/api/healthz" || echo "Warning: public domain health check failed (DNS/cert may still be provisioning)" >&2
