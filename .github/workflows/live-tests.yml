name: Live LLM Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  # Hardcoded defaults (not vars.*) -- deploy.yaml's vars.MODEL_ID etc. are
  # not actually set at the repo level; deploy.yaml only survives this
  # because its gcloud command has inline bash `:-default` fallbacks. This
  # job sets a real env var directly, so it needs a real value, matching
  # quality.yml's simulated-environment pattern.
  VERTEX_LOCATION: global
  MODEL_ID: gemini-3.6-flash
  AIMS_CLASSIFIER_MODEL_ID: gemini-3.6-flash
  AIMS_COACHING_ENABLED: "true"
  AIMS_COACHING_DEFAULT: "true"
  MEMORY_BACKEND: memory
  CHAINLIT_AUTH_SECRET: test-chainlit-secret-for-ci
  OAUTH_GOOGLE_CLIENT_ID: test-client-id-for-ci
  OAUTH_GOOGLE_CLIENT_SECRET: test-client-secret-for-ci

jobs:
  live-llm-smoke:
    runs-on: ubuntu-latest
    # Real multi-turn Vertex AI conversations across several personas; slow
    # by nature (observed ~10-15 min locally). Not a deploy gate (see
    # staging-pipeline.yml) -- runs in parallel so a flaky/slow live-LLM run
    # never blocks or delays a deploy.
    timeout-minutes: 30
    env:
      WORKLOAD_IDP: ${{ secrets.WORKLOAD_IDP }}
      WORKLOAD_SA: ${{ secrets.WORKLOAD_SA }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate auth configuration
        run: |
          if [[ -n "$GCP_SA_KEY" ]]; then
            echo "Using credentials_json authentication via GCP_SA_KEY"
            exit 0
          fi
          if [[ -n "$WORKLOAD_IDP" && -n "$WORKLOAD_SA" ]]; then
            echo "Using Workload Identity Federation authentication"
            exit 0
          fi
          echo "Error: Missing auth configuration. Set WORKLOAD_IDP and WORKLOAD_SA secrets for WIF, or GCP_SA_KEY for JSON key auth." >&2
          exit 1

      - name: Authenticate to Google Cloud (WIF)
        if: env.WORKLOAD_IDP != '' && env.WORKLOAD_SA != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDP }}
          service_account: ${{ secrets.WORKLOAD_SA }}

      - name: Authenticate to Google Cloud (Service Account JSON)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run live-LLM concern-checklist smoke tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          pytest tests/integration/test_concern_checklist_live.py -m live_llm -v --no-cov
