name: Main PR Source Guard

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, edited, ready_for_review ]

permissions:
  contents: read

jobs:
  require-staging-source:
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Require staging source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "staging" ]]; then
            echo "Pull requests into main must come from the staging branch." >&2
            echo "Actual source branch: $HEAD_REF" >&2
            exit 1
          fi
