name: Quality Checks

on:
  pull_request:
    branches: [ "staging" ]
  push:
    branches: [ "staging" ]

env:
  # Simulate deployment environment variables for testing
  PROJECT_ID: test-project
  REGION: us-central1
  MODEL_ID: gemini-2.0-flash
  TEMPERATURE: "0.2"
  MAX_TOKENS: "768"
  AIMS_COACHING_ENABLED: "true"
  AIMS_COACHING_DEFAULT: "true"
  MEMORY_BACKEND: memory
  CHAINLIT_AUTH_SECRET: test-chainlit-secret-for-ci
  OAUTH_GOOGLE_CLIENT_ID: test-client-id-for-ci
  OAUTH_GOOGLE_CLIENT_SECRET: test-client-secret-for-ci

jobs:
  lint-and-sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Install Linting Tools
        run: pip install ruff mypy bandit
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy app
      - name: Run Bandit
        run: bandit -r app -x tests,scripts

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Tests with Coverage
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          pytest --ignore=tests/integration --cov=app --cov-report=xml
      - name: Detect changed covered files
        id: coverage_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RANGE="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${BEFORE_SHA}...${CURRENT_SHA}"
          else
            RANGE="${CURRENT_SHA}~1...${CURRENT_SHA}"
          fi

          echo "Coverage diff range: $RANGE"
          CHANGED="$(
            git diff --name-only "$RANGE" -- \
              'app/*.py' \
              'app/**/*.py' \
              ':(exclude)app/__init__.py' \
              ':(exclude)app/*/__init__.py' \
              ':(exclude)app/static/**' \
              ':(exclude)app/vertex.py' \
              ':(exclude)app/services/aims_dependencies.py' \
              ':(exclude)app/memory_store.py' || true
          )"

          if [[ -n "$CHANGED" ]]; then
            echo "has_covered_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed covered files:"
            echo "$CHANGED"
          else
            echo "has_covered_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changed covered app Python files; skipping changed-file coverage gate."
          fi
      - name: Enforce Coverage on Changed Files
        if: steps.coverage_scope.outputs.has_covered_changes == 'true'
        uses: orgoro/coverage@v3.3.1
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdModified: 0.85
          thresholdNew: 0.85
