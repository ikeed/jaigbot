<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">AIMSBot syringe circular icon</title>
  <desc id="desc">Circular blue and green medical logo with syringe, ECG waveform, droplet, and AIMSBot text.</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="25%" r="78%">
      <stop offset="0" stop-color="#55d7ff"/>
      <stop offset="0.42" stop-color="#1aa7df"/>
      <stop offset="0.65" stop-color="#1dbf71"/>
      <stop offset="1" stop-color="#063150"/>
    </radialGradient>
    <linearGradient id="ring" x1="180" y1="140" x2="840" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0694e6"/>
      <stop offset="0.45" stop-color="#31d8ff"/>
      <stop offset="0.75" stop-color="#89e43a"/>
      <stop offset="1" stop-color="#0d5d37"/>
    </linearGradient>
    <linearGradient id="syringeGlass" x1="315" y1="340" x2="715" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf9ff"/>
      <stop offset="0.35" stop-color="#b8ebff"/>
      <stop offset="0.62" stop-color="#6bcdf4"/>
      <stop offset="1" stop-color="#e6f8ff"/>
    </linearGradient>
    <linearGradient id="syringeLiquid" x1="410" y1="430" x2="705" y2="545" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dff8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#159bd3" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="metal" x1="235" y1="405" x2="765" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#9fd6ec"/>
      <stop offset="0.55" stop-color="#e7f8ff"/>
      <stop offset="1" stop-color="#5daecb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#001524" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipCircle"><circle cx="512" cy="512" r="358"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="none"/>
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="382" fill="#061a2a"/>
    <circle cx="512" cy="512" r="366" fill="url(#ring)"/>
    <circle cx="512" cy="512" r="342" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="326" fill="none" stroke="#baf7ff" stroke-width="8" opacity="0.8"/>
    <circle cx="512" cy="512" r="301" fill="none" stroke="#85df3d" stroke-width="4" opacity="0.55"/>

    <g clip-path="url(#clipCircle)">
      <path d="M148 612 C285 560 400 602 535 570 C670 537 758 520 890 550 L890 870 L148 870 Z" fill="#0b4873" opacity="0.88"/>
      <path d="M145 706 C300 675 433 712 553 685 C690 654 778 648 893 674 L893 870 L145 870 Z" fill="#076f52" opacity="0.9"/>
      <path d="M145 747 C332 716 459 767 624 728 C720 706 797 714 893 738" fill="none" stroke="#8de43f" stroke-width="9" opacity="0.45"/>
      <path d="M155 431 H286 l20 24 16-82 19 139 29-67 22 40 25-11 20 26 h94 l22-49 27 121 25-88 20 38 21-17 21 23 h202" fill="none" stroke="#e7fbff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
      <path d="M150 410 H870" stroke="#ffffff" stroke-width="3" opacity="0.18"/>
      <path d="M150 470 H870" stroke="#ffffff" stroke-width="2" opacity="0.12"/>
    </g>

    <!-- syringe group, fully inside circle -->
    <g transform="translate(115 560) rotate(-27)" filter="url(#shadow)">
      <!-- needle -->
      <line x1="615" y1="0" x2="758" y2="0" stroke="#08243a" stroke-width="10" stroke-linecap="round"/>
      <line x1="620" y1="0" x2="753" y2="0" stroke="#d8f6ff" stroke-width="4" stroke-linecap="round"/>
      <polygon points="753,-8 782,0 753,8" fill="#d8f6ff" stroke="#08243a" stroke-width="5" stroke-linejoin="round"/>
      <!-- hub -->
      <rect x="562" y="-25" width="64" height="50" rx="10" fill="url(#metal)" stroke="#08243a" stroke-width="8"/>
      <rect x="535" y="-36" width="38" height="72" rx="8" fill="#dff5ff" stroke="#08243a" stroke-width="8"/>
      <!-- barrel -->
      <rect x="255" y="-57" width="300" height="114" rx="16" fill="url(#syringeGlass)" stroke="#08243a" stroke-width="10"/>
      <path d="M275 12 H536 V48 H275 Z" fill="url(#syringeLiquid)" opacity="0.75"/>
      <path d="M283 -40 H532" stroke="#ffffff" stroke-width="9" opacity="0.55" stroke-linecap="round"/>
      <!-- barrel gradations -->
      <g stroke="#08243a" stroke-width="5" opacity="0.78">
        <line x1="292" y1="-54" x2="292" y2="-18"/><line x1="318" y1="-54" x2="318" y2="-4"/>
        <line x1="344" y1="-54" x2="344" y2="-18"/><line x1="370" y1="-54" x2="370" y2="-4"/>
        <line x1="396" y1="-54" x2="396" y2="-18"/><line x1="422" y1="-54" x2="422" y2="-4"/>
        <line x1="448" y1="-54" x2="448" y2="-18"/><line x1="474" y1="-54" x2="474" y2="-4"/>
        <line x1="500" y1="-54" x2="500" y2="-18"/>
      </g>
      <g fill="#eaffff" opacity="0.85">
        <circle cx="468" cy="32" r="6"/><circle cx="494" cy="32" r="6"/><circle cx="520" cy="32" r="6"/>
      </g>
      <!-- flange -->
      <rect x="222" y="-78" width="35" height="156" rx="13" fill="url(#metal)" stroke="#08243a" stroke-width="9"/>
      <!-- plunger shaft and realistic end -->
      <rect x="80" y="-18" width="146" height="36" rx="12" fill="url(#metal)" stroke="#08243a" stroke-width="8"/>
      <rect x="45" y="-35" width="54" height="70" rx="12" fill="#eaf9ff" stroke="#08243a" stroke-width="8"/>
      <rect x="4" y="-73" width="40" height="146" rx="15" fill="url(#metal)" stroke="#08243a" stroke-width="9"/>
      <path d="M255 -47 L296 47" stroke="#ffffff" stroke-width="8" opacity="0.45"/>
      <path d="M323 -51 L367 52" stroke="#ffffff" stroke-width="5" opacity="0.32"/>
    </g>

    <!-- droplet, inside border and visually off needle -->
    <g transform="translate(804 325)" filter="url(#softGlow)">
      <path d="M0 -38 C28 0 34 25 12 44 C-8 62 -42 47 -42 15 C-42 -5 -24 -21 0 -38Z" fill="#4ed9ff" stroke="#074466" stroke-width="7"/>
      <path d="M-10 -19 C9 5 13 20 2 31 C-8 41 -25 30 -22 13 C-20 1 -16 -8 -10 -19Z" fill="#c8f8ff" opacity="0.75"/>
    </g>

    <!-- AIMSBot text -->
    <g filter="url(#shadow)">
      <text x="508" y="736" text-anchor="middle" font-family="Arial Black, Montserrat, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-4">
        <tspan fill="#ffffff">AIMS</tspan><tspan fill="#9bed39">Bot</tspan>
      </text>
      <path d="M278 760 C395 776 594 780 735 758" fill="none" stroke="#d9fbff" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
