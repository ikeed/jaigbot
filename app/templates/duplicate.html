<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{{ messages.title }}</title>
        <style>
            body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
            .card { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; width: 500px; }
            h2 { color: #856404; margin-top: 1rem; }
            p { color: #666; line-height: 1.6; margin: 1.5rem 0; }
            .btn { 
                display: inline-block;
                background: #007bff;
                color: white;
                text-decoration: none;
                padding: 12px 24px;
                border-radius: 6px;
                font-weight: 600;
                transition: background 0.2s;
                cursor: pointer;
                border: none;
            }
            .btn:hover { background: #0056b3; }
            .icon { font-size: 48px; margin-bottom: 1rem; }
        </style>
    </head>
    <body class="aimsbot-native-page">
        <div class="card">
            <img src="/public/aimsbot.png" alt="AIMSBot" style="width: 256px; height: 256px; margin: 0 auto 1rem; display: block;" />

            <noscript>
                <div style="color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; padding: 20px; border-radius: 8px; margin-bottom: 24px; font-size: 16px; text-align: left; line-height: 1.5;">
                    <strong>{{ shared_messages.javascript_required_title }}</strong><br>
                    {{ messages.javascript_required_body }}
                    <br><br>
                    <a href="https://www.enable-javascript.com/" target="_blank" style="color: #a94442; text-decoration: underline; font-weight: 600;">
                        {{ shared_messages.javascript_required_help }}
                    </a>
                </div>
                <style>
                    #duplicate-controls { display: none !important; }
                </style>
            </noscript>

            <div id="duplicate-controls">
                <div class="icon">⚠️</div>
                <h2>{{ messages.heading }}</h2>
                <p>
                    {{ messages.body }}
                </p>
                <p style="font-size: 0.9em; color: #888;">
                    {{ messages.instruction }}
                </p>
                <a href="/chat?force=true" class="btn">{{ messages.refresh }}</a>
            </div>
        </div>
    </body>
</html>
